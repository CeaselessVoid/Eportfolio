<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact — Marshall Ngari</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="site-header">

  <span class="site-name">Marshall Ngari</span>

  <nav>
    <a href="index.html">About</a>
    <a href="cv.html">CV</a>
    <a href="projects.html">Projects</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>

</header>


<main class="contact-page">

  <section class="contact-hero">

    <!-- Large CONTACT title -->
    <div class="contact-title">
      <h1>CONTACT</h1>
    </div>


    <div class="contact-form-area">

      <p class="contact-intro">
        Looking forward to hearing from you.
      </p>


      <!-- Contact information -->

    <div class="contact-info">

  <div class="contact-info-item">
    <h2>Email</h2>
    <p>njerumarshall@gmail.com</p>
  </div>


  <div class="contact-info-item">
    <h2>Phone</h2>
    <p>+254703555170</p>
  </div>


  <div class="contact-info-item">
    <h2>Location</h2>
    <p>Nairobi, Kenya</p>
  </div>


  <div class="contact-info-item linkedin-item">
    <h2>LinkedIn</h2>

    <a
      href="https://www.linkedin.com/in/marshall-njeru-61b944265/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="LinkedIn Profile"
      class="linkedin-logo"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.13 1.45-2.13 2.94v5.67H9.35V8.99h3.42v1.56h.05c.48-.9 1.64-1.85 3.38-1.85 3.61 0 4.28 2.38 4.28 5.47v6.28zM5.34 7.43a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14zM7.12 20.45H3.56V8.99h3.56v11.46zM22.23 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.46c.98 0 1.77-.77 1.77-1.72V1.72C24 .77 23.21 0 22.23 0z"/>
      </svg>
    </a>

  </div>

</div>


      <!-- Email form -->

      <div class="contact-form-container">

        <h2>Send Me a Message</h2>

        <form class="contact-form" id="contactForm">

          <div class="form-fields">

            <!-- Left side -->

            <div class="form-left">

              <input
                type="text"
                id="name"
                placeholder="Name *"
                required
              >

              <input
                type="email"
                id="email"
                placeholder="Email *"
                required
              >

              <input
                type="text"
                id="subject"
                placeholder="Subject"
              >

            </div>


            <!-- Message -->

            <div class="form-right">

              <textarea
                id="message"
                placeholder="Message *"
                required
              ></textarea>

            </div>

          </div>


          <button type="submit">
            OPEN EMAIL
          </button>

        </form>

      </div>

    </div>

  </section>

</main>


<script>

document.getElementById("contactForm").addEventListener("submit", function(event) {

  event.preventDefault();

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const subject = document.getElementById("subject").value;
  const message = document.getElementById("message").value;

  // Use exactly what the user entered as the subject
  const emailSubject = subject;

  // Construct the email body
  const emailBody =
    "Name: " + name + "\n" +
    "Email: " + email + "\n\n" +
    message;

  // Create the mailto link
  const mailto =
    "mailto:njerumarshall@gmail.com" +
    "?subject=" + encodeURIComponent(emailSubject) +
    "&body=" + encodeURIComponent(emailBody);

  // Create a temporary link
  const link = document.createElement("a");
  link.href = mailto;
  link.target = "_blank";
  link.rel = "noopener noreferrer";

  // Open the email in a new tab/window
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

});

</script>

</body>

</html>
