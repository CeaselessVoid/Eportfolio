    <a href="contact.html">Contact</a>
  </nav>
</header>


<main>

  <section class="projects">
  <button class="project-prev" onclick="changeProject(-1)">&#10094;</button>
  <button class="project-next" onclick="changeProject(1)">&#10095;</button>
    <!-- Project 1 -->
    <div class="project-slide active">
      <h1>Ice Buoy Frame Design</h1>

      <img src="images/bouy.png"
           alt="Ice Buoy Frame Design">

      <a href="ice-buoy.html" class="project-link">

    <!-- Project 2 -->

      <h1>Micromouse Maze Solver</h1>

      <img src="images/mouse.png"
           alt="Micromouse">

      <a href="micromouse.html" class="project-link">
        View Project →

    </div>


  <!-- Project 3 -->
<div class="project-slide">
  <h1>Helicopter Veroboard Controller</h1>

  <img src="images/Veroboard_controller.png"
       alt="Helicopter Controller">

  <a href="helicopter-controller.html" class="project-link">

<!-- Project 4 -->
<div class="project-slide">

    <!-- Final slide -->
    <div class="project-slide other-work">

      <a href="other-projects.html" class="other-work-link">
        View Other Projects →
      </a>
    </div>

  </section>

</main>


<script>

let currentSlide = 0;

const slides = document.querySelectorAll(".project-slide");
const slideDuration = 5000;
const fadeDuration = 2000;

function showSlide(nextSlide) {

  const current = slides[currentSlide];

  current.classList.remove("active");
  current.classList.add("fade-out");

  setTimeout(() => {

    current.classList.remove("fade-out");

    currentSlide = nextSlide;

    if (currentSlide >= slides.length) {
      currentSlide = 0;
    }

    if (currentSlide < 0) {
      currentSlide = slides.length - 1;
    }

    slides[currentSlide].classList.add("active");

  }, fadeDuration);
}


function changeProject(direction) {

  let nextSlide = currentSlide + direction;

  if (nextSlide >= slides.length) {
    nextSlide = 0;
  }

  if (nextSlide < 0) {
    nextSlide = slides.length - 1;
  }

  showSlide(nextSlide);
}


// Automatically change project every 15 seconds
setInterval(() => {

  let nextSlide = currentSlide + 1;

  if (nextSlide >= slides.length) {
    nextSlide = 0;
  }

  showSlide(nextSlide);

}, slideDuration);

</script>

</body>
</html>
