<script>
let currentSlide = 0;
let slideTimer;
let fadeTimer;

const slides = document.querySelectorAll(".project-slide");

const slideDuration = 4000; // 15 seconds
const fadeDuration = 2000;   // 2 second fade


function showSlide(nextSlide) {

  // Cancel any fade that is currently happening
  clearTimeout(fadeTimer);

  const current = slides[currentSlide];

  // Immediately remove the current slide
  current.classList.remove("active", "fade-out");

  // Set the new slide
  currentSlide = nextSlide;

  // Handle looping
  if (currentSlide >= slides.length) {
    currentSlide = 0;
  }

  if (currentSlide < 0) {
    currentSlide = slides.length - 1;
  }

  // Show the selected slide
  slides[currentSlide].classList.add("active");

  // Restart the automatic timer
  restartTimer();
}


function changeProject(direction) {

  let nextSlide = currentSlide + direction;

  if (nextSlide >= slides.length) {
    nextSlide = 0;
  }

  if (nextSlide < 0) {
    nextSlide = slides.length - 1;
  }

  showSlide(nextSlide);
}


function automaticSlide() {

  const current = slides[currentSlide];

  // Start fading the current slide
  current.classList.add("fade-out");

  // Wait for the fade to finish
  fadeTimer = setTimeout(() => {

    current.classList.remove("active", "fade-out");

    currentSlide++;

    if (currentSlide >= slides.length) {
      currentSlide = 0;
    }

    slides[currentSlide].classList.add("active");

  }, fadeDuration);
}


function restartTimer() {

  clearInterval(slideTimer);

  slideTimer = setInterval(automaticSlide, slideDuration);
}


// Start the slideshow
slides[currentSlide].classList.add("active");
restartTimer();

</script>

</body>
